# Runs the five Mallard Protocol tests on every pull request. Tests only: no deploy, no secrets.
name: tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mallard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
  daz-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
        working-directory: tools/daz-log
