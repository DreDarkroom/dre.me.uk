# Manual deploy of dazzle.dredarkroom.com. It only runs when Dre presses "Run workflow" in GitHub Actions. Nothing deploys on a push or merge.
# One-time setup (Dre): in the repository's Settings > Secrets and variables > Actions, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Use a narrowly scoped token (see docs/dazzledre/CLOUDFLARE-ACCESS.md). Never paste the token anywhere else.
name: deploy-dazzle
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no deploy)"
        type: boolean
        default: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wrangler (dry run)
        if: ${{ inputs.dry_run }}
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/out -c deploy/dazzle/wrangler.jsonc
      - name: Wrangler (deploy)
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy -c deploy/dazzle/wrangler.jsonc
